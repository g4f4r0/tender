name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o tender ./cmd/tender
