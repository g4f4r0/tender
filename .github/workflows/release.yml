name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build
        run: |
          mkdir dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o dist/tender_linux_amd64 ./cmd/tender
          cd dist
          sha256sum tender_linux_amd64 > SHA256SUMS
      # Signs SHA256SUMS with the release key, an ed25519 seed kept only in this secret and in
      # Infisical. Every tender update checks SHA256SUMS.sig against the public keys in
      # internal/install/release.go, so this step also checks that the key matches one of them.
      - name: Sign the checksums
        env:
          SIGNING_KEY: ${{ secrets.TENDER_RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          umask 077
          key="$RUNNER_TEMP/release-key.der"
          trap 'rm -f "$key" "$RUNNER_TEMP/sig.bin"' EXIT
          # A PKCS#8 ed25519 private key is this fixed prefix followed by the 32-byte seed.
          { printf '\060\056\002\001\000\060\005\006\003\053\145\160\004\042\004\040'; printf '%s' "$SIGNING_KEY" | base64 -d; } > "$key"
          [ "$(wc -c < "$key")" -eq 48 ] || { echo "TENDER_RELEASE_SIGNING_KEY must be the base64 of a 32-byte ed25519 seed" >&2; exit 1; }
          public=$(openssl pkey -inform DER -in "$key" -pubout -outform DER | tail -c 32 | base64)
          grep -qF "\"$public\"" internal/install/release.go || { echo "the signing key's public key $public is not in internal/install/release.go" >&2; exit 1; }
          openssl pkeyutl -sign -inkey "$key" -keyform DER -rawin -in dist/SHA256SUMS -out "$RUNNER_TEMP/sig.bin"
          base64 -w0 "$RUNNER_TEMP/sig.bin" > dist/SHA256SUMS.sig
          echo >> dist/SHA256SUMS.sig
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/tender_linux_amd64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/tender_linux_amd64 dist/SHA256SUMS dist/SHA256SUMS.sig \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease
