version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    staticcheck:
      # The defaults, minus ST1005: errors that reach people are sentences that end with a period.
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    depguard:
      rules:
        machines:
          files: ["**/internal/machines/**"]
          deny:
            - pkg: github.com/g4f4r0/tender/internal/backups
              desc: domains must not import each other
            - pkg: github.com/g4f4r0/tender/internal/notifications
              desc: domains must not import each other
        backups:
          files: ["**/internal/backups/**"]
          deny:
            - pkg: github.com/g4f4r0/tender/internal/machines
              desc: domains must not import each other
            - pkg: github.com/g4f4r0/tender/internal/notifications
              desc: domains must not import each other
        notifications:
          files: ["**/internal/notifications/**"]
          deny:
            - pkg: github.com/g4f4r0/tender/internal/machines
              desc: domains must not import each other
            - pkg: github.com/g4f4r0/tender/internal/backups
              desc: domains must not import each other
        shared:
          files:
            - "**/internal/db/**"
            - "**/internal/config/**"
            - "**/internal/server/**"
            - "**/internal/mcp/**"
            - "**/internal/secret/**"
            - "**/internal/client/**"
            - "**/internal/install/**"
          deny:
            - pkg: github.com/g4f4r0/tender/internal/machines
              desc: shared packages must not import a domain; only cmd/tender wires domains
            - pkg: github.com/g4f4r0/tender/internal/backups
              desc: shared packages must not import a domain; only cmd/tender wires domains
            - pkg: github.com/g4f4r0/tender/internal/notifications
              desc: shared packages must not import a domain; only cmd/tender wires domains
